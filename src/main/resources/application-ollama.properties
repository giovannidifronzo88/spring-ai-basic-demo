# --- PROFILO OLLAMA (locale, nessuna chiave richiesta) ---
# Prerequisiti: ollama pull gemma3:1b ; ollama pull nomic-embed-text
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=gemma3:1b
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Collection dedicate: nomic-embed-text (768 dim) non e' compatibile con OpenAI
spring.ai.vectorstore.qdrant.collection-name=my_vector_store_ollama
app.qdrant.collections.ccnl.name=ccnl_vector_store_ollama

# Lo starter OpenAI resta nel classpath: serve un valore per creare i bean, ma non viene usato
spring.ai.openai.api-key=unused-in-ollama-profile
