# --- PROFILO OPENAI (rete disponibile, chiave OPEN_AI_KEY) ---
spring.ai.model.chat=openai
spring.ai.model.embedding=openai

spring.ai.openai.api-key=${OPEN_AI_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Collection dedicate: gli embedding OpenAI (1536 dim) non sono compatibili con quelli Ollama
spring.ai.vectorstore.qdrant.collection-name=my_vector_store_openai
app.qdrant.collections.ccnl.name=ccnl_vector_store_openai
