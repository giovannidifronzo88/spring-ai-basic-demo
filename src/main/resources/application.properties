spring.application.name=spring-ai-basic-demo

#spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.options.model=gemma3:1b

spring.ai.openai.api-key=${OPEN_AI_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

# --- CONFIGURAZIONE QDRANT CLOUD (Database Vettoriale Remoto) ---
# Inserisci l'URL del cluster cloud. Nota: Rimuovi la porta 6334 finale se inclusa, Spring usa HTTPS nativo su porta 443 per il cloud.
spring.ai.vectorstore.qdrant.host=29afde53-0ace-4190-b632-6a79ce2cf033.eu-central-1-0.aws.cloud.qdrant.io
spring.ai.vectorstore.qdrant.port=6334
#spring.ai.vectorstore.qdrant.port=443
spring.ai.vectorstore.qdrant.api-key=${QDRANT_KEY}
spring.ai.vectorstore.qdrant.use-tls=true

# Nome della raccolta in cui verranno salvati i documenti
spring.ai.vectorstore.qdrant.collection-name=my_vector_store
spring.ai.vectorstore.qdrant.initialize-schema=true

app.qdrant.collections.ccnl.name=ccnl_vector_store
app.qdrant.collections.ccnl.initialize-schema=true

app.ingestion.pdf-resource=ingestion/CCNL_dipendenti-terziario-distribuzione-servizi_2026.pdf

# --- CLIENT MCP ---
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.mcp-dummy-server.url=http://127.0.0.1:8081
spring.ai.mcp.client.streamable-http.connections.mcp-dummy-server.endpoint=/mcp

# Server MCP ufficiale di GitHub (account personale). Il token viene letto da GITHUB_PAT
# e aggiunto come header Authorization dalla classe GithubMcpConfiguration.
spring.ai.mcp.client.streamable-http.connections.mcp-github.url=https://api.githubcopilot.com
spring.ai.mcp.client.streamable-http.connections.mcp-github.endpoint=/mcp/
app.github.pat=${GITHUB_PAT:}




