spring.application.name=spring-ai-basic-demo

# Profilo attivo di default. Cambiare con SPRING_PROFILES_ACTIVE=ollama per usare Ollama in locale.
spring.profiles.default=openai

# --- CONFIGURAZIONE QDRANT CLOUD (Database Vettoriale Remoto) ---
# Inserisci l'URL del cluster cloud. Nota: Rimuovi la porta 6334 finale se inclusa, Spring usa HTTPS nativo su porta 443 per il cloud.
spring.ai.vectorstore.qdrant.host=29afde53-0ace-4190-b632-6a79ce2cf033.eu-central-1-0.aws.cloud.qdrant.io
spring.ai.vectorstore.qdrant.port=6334
#spring.ai.vectorstore.qdrant.port=443
spring.ai.vectorstore.qdrant.api-key=${QDRANT_KEY}
spring.ai.vectorstore.qdrant.use-tls=true

# Nome della raccolta: definito nei profili (application-openai / application-ollama) perche' dipende dal provider
spring.ai.vectorstore.qdrant.initialize-schema=true

app.qdrant.collections.ccnl.initialize-schema=true

app.ingestion.pdf-resource=ingestion/CCNL_dipendenti-terziario-distribuzione-servizi_2026.pdf

# --- CLIENT MCP ---
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
# Server MCP locale in HTTP. Il certificato self-signed va indicato con -Djavax.net.ssl.trustStore (vedi README)
spring.ai.mcp.client.streamable-http.connections.mcp-dummy-server.url=http://127.0.0.1:8081
spring.ai.mcp.client.streamable-http.connections.mcp-dummy-server.endpoint=/mcp
# Host del server MCP locale: il JWT viene inviato solo a questo host.
app.mcp.local-server.host=127.0.0.1
# JWT ES256 firmato con la chiave privata, inviato solo a questo host.
# MCP_CLIENT_PRIVATE_KEY_PATH = path del file PEM della chiave privata (non il contenuto).
# Generazione (una tantum, la chiave pubblica va copiata sul server):
#   openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out mcp-client-private.pem
#   openssl ec -in mcp-client-private.pem -pubout -out mcp-client-public.pem
# Il file della chiave privata non deve finire nel repository (vedi .gitignore).
app.mcp.local-server.private-key-path=${MCP_CLIENT_PRIVATE_KEY_PATH:}

#token associato al tool git locale
app.git.tool.token=${APP_GIT_TOOL_TOKEN:}

# Server MCP ufficiale di GitHub (account personale). Il token viene letto da GITHUB_PAT
# e aggiunto come header Authorization dalla classe GithubMcpConfiguration.
spring.ai.mcp.client.streamable-http.connections.mcp-github.url=https://api.githubcopilot.com
spring.ai.mcp.client.streamable-http.connections.mcp-github.endpoint=/mcp/
app.github.pat=${PERSONAL_GITHUB_PAT:}






